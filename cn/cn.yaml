services:
- name: tcp-entry
  addr: :12000
  handler:
    type: tcp
    chain: chain-mtcp
  listener:
    type: tcp
  forwarder:
    nodes:
    - name: backend
      addr: 127.0.0.1:2345

# 专用 MTCP 锚定入口，仅监听本机。
# Anchor 会主动发送 1 Byte 触发默认 Relay 首包逻辑，因此共享 connector 保持原始默认行为。
- name: mtcp-anchor
  addr: 127.0.0.1:12001
  handler:
    type: tcp
    chain: chain-mtcp
  listener:
    type: tcp
  forwarder:
    nodes:
    - name: anchor
      addr: 127.0.0.1:12346

chains:
- name: chain-mtcp
  hops:
  - name: jp
    nodes:
    - name: jp-mtcp
      addr: example.invalid:11000
      connector:
        type: relay
      dialer:
        type: mtcp
        metadata:
          mux.version: 2
          mux.keepaliveDisabled: false
          mux.keepaliveInterval: 10s
          mux.keepaliveTimeout: 30s
          mux.maxFrameSize: 32768
          mux.maxReceiveBuffer: 33554432
          mux.maxStreamBuffer: 4194304
